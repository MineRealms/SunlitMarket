plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run-client')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            workingDirectory project.file('run-client')
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }
        server {
            workingDirectory project.file(project.hasProperty('coreMinimal') ? 'run-minimal' : 'run-server')
            args '--nogui'
        }
    }
}

repositories {
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net' }
    maven { name = 'LatvianDev'; url = 'https://maven.latvian.dev/releases' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    compileOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    if (!project.hasProperty('coreMinimal')) {
        runtimeOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
        runtimeOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
        runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    def values = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range  : forge_version_range,
            loader_version_range : loader_version_range,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            kubejs_version       : kubejs_version
    ]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        )
    }
}

tasks.named('test', Test).configure { useJUnitPlatform() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-deprecation'
}
